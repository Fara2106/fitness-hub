name = "fitness-hub-api"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "fitness-hub-db"
# Database D1 creato il 2026-11-03 (fase 1).
database_id = "d97193e4-47e9-48ab-916d-9c0203d2b11a"

[vars]
# Proprietario dei record oggi esistenti (identificatore, non un segreto). Il token SYNC_TOKEN
# corrisponde a questo proprietario (resolveOwner in src/worker.mjs).
PRIMARY_OWNER = "7e8c37a9-62dd-4f25-8be3-1c209840db09"
# Token legacy SYNC_TOKEN → PRIMARY_OWNER: acceso solo durante il passaggio agli account (la PWA col token
# incollato continua a sincronizzare). Si spegne ("false") quando app e PWA usano le sessioni (Task 9C).
LEGACY_TOKEN_ENABLED = "true"
# Registrazione chiusa: l'unico account è quello di Lorenzo (creato con admin/account.mjs).
REGISTRATION_OPEN = "false"
# Accedi con Apple: acceso dal 2026-11-06 (entra solo chi ha collegato l'Apple ID al suo account: la registrazione resta chiusa).
APPLE_SIGNIN_ENABLED = "true"
APPLE_BUNDLE_ID = "it.faraoni.fitnesshub"
# Email del proprietario: se Apple la conferma, Accedi con Apple entra sui dati di PRIMARY_OWNER (e crea l'account se manca).
OWNER_EMAIL = "lorefara97@gmail.com"
# Secret (non qui): SYNC_TOKEN (solo durante il passaggio) e PASSWORD_PEPPER (pepper delle password, creato con
# `node admin/account.mjs init-pepper` e caricato con `npx wrangler secret put PASSWORD_PEPPER < ~/.config/fitness-hub/pepper`).
